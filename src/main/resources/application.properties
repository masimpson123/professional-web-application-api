spring.application.name=service-2025
# Cloud Run sets PORT (8080). Locally use 8081 so the Express server can keep 8080.
server.port=${PORT:8081}

# Secrets. On Cloud Run they come from environment variables. Locally, they come from
# localhost.properties in the project root (gitignored), which overrides these values.
spring.config.import=optional:file:localhost.properties
gemini.api.key=${GEMINI_KEY:}
zoom.sdk.key=${ZOOM_SDK_KEY:}
zoom.sdk.secret=${ZOOM_SDK_SECRET:}

# Browser origins allowed to open the WebSocket broker, comma-separated.
# localhost.properties overrides this to add the local dev server.
websocket.allowed-origins=https://msio-u7qjhl7iia-uc.a.run.app,https://msio-205823180568.us-central1.run.app
